<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRIS - Attendance & Approval System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="app-container" id="app">
    <header class="app-header">
        <div class="logo">
            <h1>HRIS<span>Enterprise Edition</span></h1>
        </div>
        <div class="user-info hidden" id="userInfo">
            <span class="user-badge" id="userNameDisplay">-</span>
            <span class="role-badge" id="userRoleDisplay">-</span>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </header>

    <main class="main-content" id="mainContent">
        <div id="loadingScreen" class="loading-screen">
            <div class="spinner"></div>
            <p>Memuat Aplikasi...</p>
        </div>

        <div id="loginScreen" class="login-screen hidden">
            <h2>🔐 Login HRIS</h2>
            <div class="form-group">
                <label>Nama Depan</label>
                <input type="text" id="loginEmail" placeholder="Masukkan nama depan Anda">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Password (default: pass123)">
            </div>
            <button class="btn btn-primary btn-full" id="loginBtn">Masuk</button>
            <div id="apiStatus" class="api-status"></div>
        </div>

        <div id="dashboardScreen" class="hidden">
            <div class="tabs" id="tabsContainer"></div>
            <div id="tabContent"></div>
        </div>
    </main>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
